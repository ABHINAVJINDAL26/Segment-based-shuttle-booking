spring:
  datasource:
    url: jdbc:h2:mem:shuttledb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;NON_KEYWORDS=USER
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  flyway:
    enabled: false

  h2:
    console:
      enabled: true
      path: /h2-console

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 200ms

  cache:
    type: simple    # Use simple in-memory cache instead of Redis

server:
  port: 9090

jwt:
  secret: local-dev-secret-key-at-least-256-bits-long-for-testing-only
  expiration-ms: 86400000

logging:
  level:
    com.movinsync.shuttle: DEBUG
    org.springframework.security: WARN

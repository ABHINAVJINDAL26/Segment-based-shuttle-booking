spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/office_shuttle}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 5000ms

  cache:
    type: redis
    redis:
      time-to-live: 300000

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:very-secret-key-at-least-256-bits-long-change-in-production-env}
  expiration-ms: 86400000

logging:
  level:
    com.movinsync.shuttle: DEBUG
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

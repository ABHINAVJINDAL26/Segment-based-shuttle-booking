services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: shuttle-postgres
    restart: always
    environment:
      POSTGRES_DB: office_shuttle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d office_shuttle"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis In-Memory Cache
  redis:
    image: redis:7-alpine
    container_name: shuttle-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Spring Boot Application
  app:
    build: .
    container_name: shuttle-app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/office_shuttle
      DB_USERNAME: postgres
      DB_PASSWORD: postgrespassword
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: c2VjdXJlLW1vdmluc3luYy1vZmZpY2Utc2h1dHRsZS1ib29raW5nLXNlY3JldC1rZXktMjAyNiE=
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  postgres_data:
  redis_data:
